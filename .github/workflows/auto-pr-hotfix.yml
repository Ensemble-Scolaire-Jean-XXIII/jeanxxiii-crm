name: Create Hotfix PR

on:
  push:
    branches:
      - hotfix/prod

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base main --head hotfix/prod --title "merge(hotfix): hotfix/prod into main" --body "Automated PR from hotfix/prod to main." || true
