services:
  db-jeanxxiii-crm:
    container_name: db-jeanxxiii-crm-prod
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data_prod:/var/lib/mysql
      - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G

  backend-jeanxxiii-crm:
    container_name: backend-jeanxxiii-crm-prod
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db-jeanxxiii-crm-prod
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      LEXPRESS_API_URL: ${LEXPRESS_API_URL}
      LEXPRESS_USER: ${LEXPRESS_USER}
      LEXPRESS_API_KEY: ${LEXPRESS_API_KEY}
    depends_on:
      - db-jeanxxiii-crm
    networks:
      - internal
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 1G

  frontend-jeanxxiii-crm:
    container_name: frontend-jeanxxiii-crm-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - backend-jeanxxiii-crm
    networks:
      - internal
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 1536M

  nginx:
    container_name: nginx-proxy-prod
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend-jeanxxiii-crm
    networks:
      - proxy-net

  certbot:
    container_name: certbot-prod
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

volumes:
  db_data_prod:

networks:
  internal:
    internal: true
  proxy-net:
