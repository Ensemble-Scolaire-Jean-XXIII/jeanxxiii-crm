services:
  db-jeanxxiii-crm:
    container_name: db-jeanxxiii-crm
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Europe/Paris
    ports:
      - "${DB_PORT}:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD",
        ]
      interval: 2s
      timeout: 2s
      retries: 3
    volumes:
      - db_data:/var/lib/mysql

  backend-jeanxxiii-crm:
    container_name: backend-jeanxxiii-crm
    build: ./backend
    ports:
      - "${BACKEND_PORT}:5000"
    environment:
      DB_HOST: db-jeanxxiii-crm
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      LEXPRESS_API_URL: ${LEXPRESS_API_URL}
      LEXPRESS_USER: ${LEXPRESS_USER}
      LEXPRESS_API_KEY: ${LEXPRESS_API_KEY}
      TZ: Europe/Paris
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db-jeanxxiii-crm:
        condition: service_healthy

  frontend-jeanxxiii-crm:
    container_name: frontend-jeanxxiii-crm
    build: ./frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-jeanxxiii-crm

volumes:
  db_data:
